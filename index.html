// Leave empty if participants will submit through the Google Form (copy or file) instead.
const ENDPOINT = "";

// Keep these fixed once data collection starts, so later rounds stay comparable.
const STUDY_VERSION = "v1";
const COHORT = "all_students";   // open to all levels; filter on participant.level ("undergraduate" / "postgraduate" / "doctoral" / "faculty") when analysing
const MIN_WORDS = 80, MAX_WORDS = 120;

const RESEARCHER_CONTACT = "naqiya.bharmal22@stmirascollegepune.edu.in";

// Each participant gets ONE randomly chosen set. Within it, which topic goes to
// the independent task and which to the AI task is also randomized (counterbalancing).
const SETS = {
  A: ["Students should be allowed to use their phones in class as long as they don't disturb others.",
      "Every school should require students to learn a second language."],
  B: ["It is better to have a few close friends than a large social circle.",
      "Living in a big city is better than living in a small town."],
  C: ["Social media does more good than harm to society.",
      "Online shopping does more good than harm to local businesses."],
  D: ["Attendance should not be compulsory in college.",
      "Every student should be taught how to manage money before graduating."]
};
const setIds = Object.keys(SETS);
const setId = setIds[Math.floor(Math.random() * setIds.length)];
const swapTopics = Math.random() < 0.5;
const [topicA, topicB] = SETS[setId];
const PROMPTS = swapTopics ? { independent: topicB, ai: topicA } : { independent: topicA, ai: topicB };
const AI_USE_TYPES = [
  "I asked the AI to write the full response and used it (edited or not)",
  "I asked the AI for ideas or an outline, then wrote it myself",
  "I wrote a draft first, then asked the AI to improve it",
  "I used the AI only for grammar, spelling or fact checks"
];

const HONESTY = ["Completely on my own", "Mostly on my own, with a little outside help", "I used AI or other outside help"];

/* ---------- STATE ---------- */
const order = Math.random() < 0.5 ? ["independent", "ai"] : ["ai", "independent"];
const data = { study_version: STUDY_VERSION, cohort: COHORT, participant: {}, order, prompt_set: setId, topics_swapped: swapTopics, tasks: {}, started_at: new Date().toISOString() };
const steps = ["intro", "task1", "task2", "done"];

const app = document.getElementById("app");
const bar = document.getElementById("bar");
const $ = (s, r = document) => r.querySelector(s);
const words = t => (t.trim().match(/\S+/g) || []).length;

function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function scale(name, lo, hi) {
  let out = '<div class="scale">';
  for (let i = 1; i <= 5; i++) out += `<label class="opt"><input type="radio" name="${name}" value="${i}"> ${i}</label>`;
  return out + `</div><div class="muted">1 = ${lo} &nbsp; 5 = ${hi}</div>`;
}
const TLX = [
  ["mental", "Mental demand", "How mentally demanding was the task?", "Very low", "Very high"],

  ["temporal", "Temporal demand", "How hurried or rushed was the pace of the task?", "Very low", "Very high"],

];
function tlxHTML() {
  return TLX.map(([k, t, q, lo, hi]) => `<div class="tlx"><div><b>${t}</b>: ${q}</div>
    <input type="range" min="0" max="100" step="5" value="50" data-k="${k}" aria-label="${t}">
    <div class="ends"><span>${lo}</span><span class="v" id="v-${k}">move the slider</span><span>${hi}</span></div></div>`).join("");
}
function bindTLX() {
  document.querySelectorAll(".tlx input").forEach(r => {
    const mark = () => { r.dataset.t = "1"; $("#v-" + r.dataset.k).textContent = r.value; };
    ["input", "change", "pointerup", "keydown"].forEach(ev => r.addEventListener(ev, mark));
  });
}
function tlxDone() { return [...document.querySelectorAll(".tlx input")].every(r => r.dataset.t); }
function tlxValues() {
  const o = {}; let sum = 0;
  TLX.forEach(([k]) => { const v = +$(`.tlx input[data-k=${k}]`).value; o[k] = v; sum += v; });
  o.raw_tlx = Math.round(sum / TLX.length * 10) / 10;
  return o;
}

    <div class="prompt">Statement: ${esc(PROMPTS[cond])}</div>
    <label for="resp">Your counterargument (${MIN_WORDS}–${MAX_WORDS} words)</label>

    <div class="count"><span id="wc" aria-live="polite">0 words</span><span id="tm">0:00</span></div>

    <h2 style="margin-top:28px">About this task</h2>

      <label for="tool">Which AI tool did you use?</label>
      <input type="text" id="tool" placeholder="e.g. ChatGPT, Gemini, Claude, Copilot">
      <label>How did you use the AI?</label>

    ` : ""}
    ${isAI ? "" : `<label>Did you write this without any AI or outside help? <span class="muted">(Any answer is fine and will not affect anything.)</span></label>${HONESTY.map((t, i) => `<label class="opt"><input type="radio" name="honesty" value="${i}"> ${esc(t)}</label>`).join("")}`}
    <h2 style="margin-top:28px">Workload (NASA-TLX)</h2>
    <p class="muted">Move each slider to show how this task felt for you. Scale: 0 to 100.</p>

    ${scale("confidence", "not at all", "very confident")}
    <div class="err" id="err"></div>
    <button id="next">Next: memory check</button>`;

  bindTLX();
  tracker = startTracker($("#resp"));
  if (!isAI) {
    ["paste", "drop"].forEach(ev => $("#resp").addEventListener(ev, e => {
      e.preventDefault();
      $("#err").textContent = "Pasting is turned off for this task. Please type your answer.";
    }));
  }
  $("#resp").addEventListener("input", () => {
    const w = words($("#resp").value);
    $("#wc").innerHTML = (w >= MIN_WORDS && w <= MAX_WORDS) ? `<span class="ok">${w} words ✓</span>` : `${w} words`;
  });
  const t0 = Date.now();
  const timer = setInterval(() => {
    if (!$("#tm")) return clearInterval(timer);
    const s = Math.floor((Date.now() - t0) / 1000);
    $("#tm").textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }, 1000);

  $("#next").onclick = () => {
    const text = $("#resp").value, w = words(text);
    const val = name => (document.querySelector(`input[name=${name}]:checked`) || {}).value;
    if (w < MIN_WORDS || w > MAX_WORDS) return $("#err").textContent = `Your response has ${w} words. Please write between ${MIN_WORDS} and ${MAX_WORDS}.`;
    if (isAI && !$("#tool").value.trim()) return $("#err").textContent = "Enter which AI tool you used.";
    if (isAI && val("aiuse") === undefined) return $("#err").textContent = "Select how you used the AI.";
    if (!isAI && val("honesty") === undefined) return $("#err").textContent = "Answer the question about whether you used any help.";
    if (!tlxDone()) return $("#err").textContent = "Please move every workload slider (even if you keep it in the middle).";
    if (!val("confidence")) return $("#err").textContent = "Rate how confident you are in your response.";
    clearInterval(timer);
    data.tasks[cond] = {
      position: n, prompt: PROMPTS[cond], response: text, word_count: w,
      own_work_check: isAI ? null : HONESTY[+val("honesty")],
      ai_tool: isAI ? $("#tool").value.trim() : null,
      ai_use_type: isAI ? AI_USE_TYPES[+val("aiuse")] : null,
      nasa_tlx: tlxValues(), confidence: +val("confidence"),
      behaviour: tracker.finish()
    };
    renderQuiz(n, cond);
  };
}

function renderQuiz(n, cond) {
  window.scrollTo(0, 0);

    <button id="next">${n === 1 ? "Continue to Task 2" : "Finish"}</button>`;

  const t0 = Date.now(); let lost = 0;

  window.addEventListener("blur", bl); document.addEventListener("visibilitychange", vis);

  $("#next").onclick = () => {
    const val = name => (document.querySelector(`input[name=${name}]:checked`) || {}).value;
    const q1 = $("#q1").value.trim(), q2 = $("#q2").value.trim(), q3 = $("#q3").value.trim();
    if (!q1 || !q2 || !q3) return $("#err").textContent = 'Please answer questions 1 to 3 (write "don\'t remember" if you can\'t recall).';
    if (!val("recall_conf") || !val("peek")) return $("#err").textContent = "Please answer questions 4 and 5.";
    window.removeEventListener("blur", bl); document.removeEventListener("visibilitychange", vis);
    data.tasks[cond].quiz = {
      main_point: q1, reasons_recalled: q2, strongest_counterpoint: q3,
      recall_confidence: +val("recall_conf"), looked_at_something: val("peek"),
      seconds: Math.round((Date.now() - t0) / 1000), focus_lost: lost
    };
    if (n === 1) go(2); else submit();
  };
}

    const t = $("#raw"); t.parentElement.open = true; t.focus(); t.select();
    $("#cmsg").style.color = "";
    $("#cmsg").textContent = "Your browser blocked automatic copying. The text is selected below: press Ctrl+C (Cmd+C on Mac) to copy it.";
  };
  $("#copy").onclick = async () => {
    try { await navigator.clipboard.writeText(json); return copied(); } catch (e) {}
    try {
      const t = $("#raw"); t.parentElement.open = true; t.focus(); t.select();
      if (document.execCommand("copy")) return copied();
    } catch (e) {}
    manual();
  };
  $("#dl").onclick = download;
}

/* ---------- KEYSTROKE / BEHAVIOUR TRACKING ---------- */
function startTracker(el) {
  const m = { keydowns: 0, backspaces: 0, paste_events: 0, pasted_chars: 0, pauses_over_2s: 0, focus_lost: 0 };
  let first = null, last = null;
  const kd = e => {
    const now = Date.now();
    if (first === null) first = now;
    if (last !== null && now - last > 2000) m.pauses_over_2s++;
    last = now; m.keydowns++;
    if (e.key === "Backspace" || e.key === "Delete") m.backspaces++;
  };
  const ps = e => { m.paste_events++; m.pasted_chars += ((e.clipboardData || window.clipboardData).getData("text") || "").length; };
  const bl = () => m.focus_lost++;
  const vis = () => { if (document.hidden) m.focus_lost++; };
  el.addEventListener("keydown", kd); el.addEventListener("paste", ps);
  window.addEventListener("blur", bl); document.addEventListener("visibilitychange", vis);
  const began = Date.now();
  return { finish() {
    el.removeEventListener("keydown", kd); el.removeEventListener("paste", ps);
    window.removeEventListener("blur", bl); document.removeEventListener("visibilitychange", vis);
    return { ...m, total_seconds: Math.round((Date.now() - began) / 1000),
             typing_seconds: first ? Math.round((last - first) / 1000) : 0 };
  } };
}

/* ---------- SUBMIT ---------- */
function download() {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "response_" + Date.now() + ".json";
  document.body.appendChild(a); a.click(); a.remove();
}
async function submit() {
  data.submitted_at = new Date().toISOString();
  let ok = false;
  if (ENDPOINT) {
    try {
      await fetch(ENDPOINT, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(data) });
      ok = true;
    } catch (e) { ok = false; }
  }
  go(3, ok);
}

/* ---------- ROUTER ---------- */
function go(s, ok) {
  step = s; setProgress(); window.scrollTo(0, 0);
  if (s === 0) renderIntro();
  else if (s === 1) renderTask(1);
  else if (s === 2) renderTask(2);
  else renderDone(ok);
}
go(0);
</script>
